spring:
  datasource:
    # ── Set these in your .env file or environment variables ──
    # DB_URL     = your cloud PostgreSQL JDBC URL
    # DB_USERNAME= your DB username
    # DB_PASSWORD= your DB password
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dataanalytics_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5       # keep low for free-tier cloud DBs
  jpa:
    show-sql: true
    properties:
      hibernate:
        # Required for Neon / Supabase SSL connections
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:data-analytics-dev-bucket}

logging:
  level:
    com.dataanalytics: DEBUG
    org.hibernate.SQL: DEBUG
