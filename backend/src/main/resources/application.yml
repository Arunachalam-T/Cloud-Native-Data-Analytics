spring:
  application:
    name: cloud-native-data-analytics

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dataanalytics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    context-path: /

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:data-analytics-bucket}
    region: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

app:
  api:
    version: v1
  security:
    api-key: ${API_KEY:dev-secret-key-change-in-prod}
  preview:
    default-rows: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.dataanalytics: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
